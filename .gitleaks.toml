# gitleaks config for IBM Bob Live Collab (CI job `gitleaks`, `pnpm -C radar secrets:scan`).
# Default rules stay on. The only exception is commit 7c86819, which vendored upstream Orca
# (stablyai/orca@bf40d35, MIT) into app/: its public test goldens, audit logs and sample keys
# trigger 178 generic-api-key/jwt/private-key hits that are not ours. Later commits, including
# changes under app/, are still scanned.
[extend]
useDefault = true

# Single legacy [allowlist] table on purpose: gitleaks-action pins gitleaks 8.24.x, which ignores
# top-level [[allowlists]]; newer versions still read [allowlist]. Any entry matching allows the finding.
[allowlist]
description = "Upstream Orca vendoring commit; fake GitHub-PAT-shaped sanitizer test fixture (fase 11D1, D-imelda-07)"
commits = ["7c86819ec824e89a7e0a9b80097709e8c6edd7bf"]
regexes = ["ghp_1234567890abcdef1234567890abcdef1234"]
